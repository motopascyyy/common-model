plugins {
    id 'java'
    id "io.freefair.lombok" version "6.5.1"
    id 'maven-publish'
}

group = 'com.pasciitools'
version = '0.1-SNAPSHOT'
println "User: ${project.findProperty('nexusUser')}"
repositories {
    mavenCentral()
    mavenLocal()
}



publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            name = 'nexus'
            url = version.endsWith('SNAPSHOT')
                    ? 'https://nexus.pascii-tools.com/repository/maven-snapshots/'
                    : 'https://nexus.pascii-tools.com/repository/maven-releases/'
            allowInsecureProtocol = false
            credentials {
                username = project.findProperty('nexusUser') ?: ''
                password = project.findProperty('nexusPass') ?: ''
            }
        }
    }
}

dependencies {
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation 'org.jetbrains:annotations:24.0.1'
}

test {
    useJUnitPlatform()
}